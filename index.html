<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Introduction</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
 margin: 0;
 font-family: 'Inter', sans-serif;
 background: radial-gradient(circle at top, #1e293b, #020617);
 color: #e2e8f0;
 display: flex;
 justify-content: center;
 align-items: center;
 height: 100vh;
}

.container {
 background: rgba(15, 23, 42, 0.95);
 padding: 30px;
 border-radius: 20px;
 box-shadow: 0 10px 40px rgba(0,0,0,0.6);
 width: 420px;
 text-align: center;
}

h1 {
 margin-bottom: 10px;
}

p {
 opacity: 0.7;
 font-size: 14px;
}

select {
 width: 100%;
 padding: 12px;
 border-radius: 10px;
 border: none;
 margin-top: 15px;
 font-size: 16px;
 background: #69d170;
 color: #e2e8 f0;
}

button {
 margin-top: 20px;
 padding: 12px 20px;
 border-radius: 12px;
 border: none;
 font-size: 16px;
 font-weight: 600;
 background: linear-gradient(135deg, #38bdf8, #818cf8);
 color: black;
 cursor: pointer;
 transition: 0.2s;
}

button:hover {
 transform: translateY(-2px);
 box-shadow: 0 6px 20px rgba(56,189,248,0.4);
}

.results {
 margin-top: 25px;
 display: flex;
 justify-content: center;
 gap: 10px;
}

.card {
 background: #020617;
 border-radius: 16px;
 padding: 12px;
 width: 110px;
 cursor: pointer;
 border: 2px solid transparent;
 transition: 0.2s;
}

.card:hover {
 transform: scale(1.05);
}

.card img {
 width: 72px;
}

.card.selected {
 border: 2px solid #38bdf8;
}

.golden {
 margin-top: 15px;
 padding: 10px;
 border-radius: 12px;
 background: linear-gradient(135deg, gold, orange);
 color: black;
 font-weight: 600;
 animation: glow 1.5s infinite alternate;
}

@keyframes glow {
 from { box-shadow: 0 0 10px gold; }
 to { box-shadow: 0 0 25px orange; }
}
</style>
</head>

<body>

<div class="container" id="container">
 <h1>Class selection </h1>
 <p>Who's your partner?</p>

 <select id="class">
   <option value="mage">Mage</option>
   <option value="bard">Bard</option>
   <option value="articifer">Articifer</option>
   <option value="cleric">Cleric</option>
   <option value="barbarian">Barbarian</option>
   <option value="monk">Monk</option>
   <option value="druid">Druid</option>
   <option value="paladin">Paladin</option>
   <option value="ranger">Ranger</option>
   <option value="rogue">Rogue</option>
 </select>

 <button onclick="generate()">❓</button>

 <div id="golden"></div>
 <div class="results" id="results"></div>
</div>

<script>
const pools = {
 mage: ["hatenna","misdreavus","fennekin","gastly","shuppet","cyndaquil","hoothoot","murkrow","duskull", "eevee","vulpix","phantump", "venonat"],
 bard: ["popplio","whismur","noibat","toxel","galarian-zigzagoon","lotad","grookey","igglybuff","maractus","swablu","fuecoco"],
 articifer: ["klink","rotom","piplup","rookidee","pachirisu","magnemite","baltoy","ferroseed","tinkatink","elekid","magby","beldum", "porygon"],
 cleric: ["happiny","audino","comfey","riolu","oddish","spritzee","poltchageist","cleffa","drowzee","chingling", "sprigatito", "munna","chikorita","flittle"],
 barbarian: ["mankey","axew","litten","tauros","bagon","totodile","torchic","cacnea","shroomish","geodude","morpeko","applin"],
 monk: ["pawmi","meditite","snubbull","machop","chimchar","bonsly","tandemaus","cubchoo","azurill","clobopus","tyrogue", "nidoranm", "nidoranf", "makuhita"],
 druid: ["charmander","bulbasaur","squirtle","koffing","munchlax","tangela","flabebe","oricorio","espurr","castform","poliwag","sewaddle"],
 paladin: ["jangmo-o","honedge","galarian-farfetchd","shinx","ponyta","galarian-ponyta","scyther","oshawott","chespin","pawniard","charcadet","failinks"],
 ranger: ["dreepy","deino","glimmet","shellder","wingull","litwick","mareep","grubbin","clauncher","rowlet","sobble","scorbunny"],
 rogue: ["zubat","purrloin","froakie","patrat","voltorb","houndour","impidimp","charcadet","zorua","shroodle","stunky","aipom"]
};

const flavorTexts = {
 totodile: "Stay loyal.",
porygon: "Analyzing...",
 comfey: "Lended a hand.",
 zubat: "Quiet...",
 bulbasaur: "Take care.",
 oshawott: "Are you worthy?",
 chespin: "Are you worthy?.",
 meditite: "Perfect your style."
};

const genericLines = [
 "It chose you quietly.",
 "It stayed, even when it didn’t have to.",
 "You’re not sure when it decided to follow.",
 "It seems to understand you already.",
 "It feels like this wasn’t random.",
 "It watches you more than you expected.",
 "There’s something familiar about it."
];

function getFlavor(name) {
 return flavorTexts[name] || genericLines[Math.floor(Math.random() * genericLines.length)];
}

function generate() {
 const occ = document.getElementById("occupation").value;
 const pool = [...pools[occ]];

 const resultsDiv = document.getElementById("results");
 const goldenDiv = document.getElementById("golden");

 resultsDiv.innerHTML = "";
 goldenDiv.innerHTML = "";

 if (Math.random() < 0.01) {
   goldenDiv.innerHTML = '<div class="golden">Congrats! You won... uhh...?</div>';
 }

 for (let i = 0; i < 3; i++) {
   const index = Math.floor(Math.random() * pool.length);
   const name = pool.splice(index, 1)[0];

   const card = document.createElement("div");
   card.className = "card";

   const img = document.createElement("img");
   img.src = `https://img.pokemondb.net/sprites/home/normal/${name}.png`;

   const label = document.createElement("div");
   label.textContent = name.charAt(0).toUpperCase() + name.slice(1);

   card.appendChild(img);
   card.appendChild(label);

   card.onclick = () => showFinalSelection(name);

   resultsDiv.appendChild(card);
 }
}

function showFinalSelection(name) {
 const occupation = document.getElementById("occupation").value;
 const container = document.getElementById("container");

 const displayName = name.charAt(0).toUpperCase() + name.slice(1);
 const flavor = getFlavor(name);

 container.innerHTML = `
   <h1> Your Pokemon</h1>

<img src="https://img.pokemondb.net/sprites/home/normal/${name}.png" width="140">


   <h2>${displayName}</h2>
   <p>${occupation}</p>


   <p style="margin-top:15px; font-style: italic;">"${flavor}"</p>


   <button onclick="copyCard('${displayName}', '${occupation}', \`${flavor}\`)">
     📋 Copy Trainer Card
   </button>


   <br><br>


   <button onclick="location.reload()"> Reroll</button>
 `;
}



function copyCard(name, occupation, flavor) {
 const text = `
Valuable member


Occupation: ${occupation}
Partner: ${name}


"${flavor}"
`;



 navigator.clipboard.writeText(text);
 alert("Copied!");
}
</script>



</body>
</html>
